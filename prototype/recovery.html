<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hashi Tracker Prototype</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-background">
        <div class="page-content">
            <header>
                <h2>Account recovery</h2>
            </header>
            <main>
                <form>
                    <p class="form-intro">Forgot your password? No worries, let's reset it now.</p>
                    <label for="recovery-key">Enter recovery key</label>
                    <input type="text" id="recovery-key" name="recovery-key" placeholder="e.g.23438r9eufiejf8w3yur80">
                    <label for="password">Enter password</label>
                    <input type="password" id="password" name="password" placeholder="8-12 characters">
                    <label for="repeat-password">Re-enter password</label>
                    <input type="password" id="repeat-password" name="repeat-password" placeholder="Re-enter password">
                    <button class="btn">Submit</button>
                </form>
                <p>Remember your password? <a href="login.html">Log in here</a></p>
            </main>
        </div>
    </div>
</body>
</html>

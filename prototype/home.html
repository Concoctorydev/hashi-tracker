<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hashi Tracker Prototype</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-background">
        <div class="page-content">
            <header>
                <h1>Hi, Amanda!😘 Log your entries here.</h1>
            </header>
            <main>
                <form>
                    <details>
                        <summary>Symptoms</summary>
                            <div class="details-content">
                                <div class="field-row">
                                    <label for="fatigue">Fatigue</label>
                                    <select id="fatigue" name="fatigue">
                                        <option value="none">None</option>
                                        <option value="mild">Mild</option>
                                        <option value="moderate">Moderate</option>
                                        <option value="severe">Severe</option>
                                    </select>
                                </div>
                                <div class="field-row">
                                    <label for="brain-fog">Brain Fog</label>
                                    <select id="brain-fog" name="brain-fog">
                                        <option value="none">None</option>
                                        <option value="mild">Mild</option>
                                        <option value="moderate">Moderate</option>
                                        <option value="severe">Severe</option>
                                    </select>
                                </div>
                                <div class="field-row">
                                    <label for="constipation">Constipation</label>
                                    <select id="constipation" name="constipation">
                                        <option value="none">None</option>
                                        <option value="mild">Mild</option>
                                        <option value="moderate">Moderate</option>
                                        <option value="severe">Severe</option>
                                    </select>
                                </div>
                                <div class="field-row">
                                    <label for="muscle-aches">Muscle aches/weakness</label>
                                    <select id="muscle-aches" name="muscle-aches">
                                        <option value="none">None</option>
                                        <option value="mild">Mild</option>
                                        <option value="moderate">Moderate</option>
                                        <option value="severe">Severe</option>
                                    </select>
                                </div>
                                <div class="field-row">
                                    <label for="joint-pain">Joint pain and stiffness</label>
                                    <select id="joint-pain" name="joint-pain">
                                        <option value="none">None</option>
                                        <option value="mild">Mild</option>
                                        <option value="moderate">Moderate</option>
                                        <option value="severe">Severe</option>
                                    </select>
                                </div>
                                <div class="field-row">
                                    <label for="cold-intolerance">Cold intolerance</label>
                                    <select id="cold-intolerance" name="cold-intolerance">
                                        <option value="none">None</option>
                                        <option value="mild">Mild</option>
                                        <option value="moderate">Moderate</option>
                                        <option value="severe">Severe</option>
                                    </select>
                                </div>
                                <div class="field-row">
                                    <label for="depression">Depression</label>
                                    <select id="depression" name="depression">
                                        <option value="none">None</option>
                                        <option value="mild">Mild</option>
                                        <option value="moderate">Moderate</option>
                                        <option value="severe">Severe</option>
                                    </select>
                                </div>
                                <div class="field-row">
                                    <label for="hair-loss">Hair loss</label>
                                    <select id="hair-loss" name="hair-loss">
                                        <option value="none">None</option>
                                        <option value="mild">Mild</option>
                                        <option value="moderate">Moderate</option>
                                        <option value="severe">Severe</option>
                                    </select>
                                </div>
                                <div class="field-row">
                                    <label for="dry-skin">Dry skin</label>
                                    <select id="dry-skin" name="dry-skin">
                                        <option value="none">None</option>
                                        <option value="mild">Mild</option>
                                        <option value="moderate">Moderate</option>
                                        <option value="severe">Severe</option>
                                    </select>
                                </div>
                                <div class="field-row">
                                    <label for="irregular-periods">Irregular/heavy periods</label>
                                    <select id="irregular-periods" name="irregular-periods">
                                        <option value="none">None</option>
                                        <option value="mild">Mild</option>
                                        <option value="moderate">Moderate</option>
                                        <option value="severe">Severe</option>
                                    </select>
                                </div>
                                <div class="field-row">
                                    <label for="puffy-face">Puffy face/eyes</label>
                                    <select id="puffy-face" name="puffy-face">
                                        <option value="none">None</option>
                                        <option value="mild">Mild</option>
                                        <option value="moderate">Moderate</option>
                                        <option value="severe">Severe</option>
                                    </select>
                                </div>
                                <div class="field-row">
                                    <label for="decreased-sex-drive">Decreased sex drive</label>
                                    <select id="decreased-sex-drive" name="decreased-sex-drive">
                                        <option value="none">None</option>
                                        <option value="mild">Mild</option>
                                        <option value="moderate">Moderate</option>
                                        <option value="severe">Severe</option>
                                    </select>
                                </div>
                            </div>
                    </details>
                    <details>
                        <summary>Lifestyle factors</summary>
                            <div class="details-content">
                                <div class="field-row">
                                    <label for="sleep-hours">Sleep (hours/minutes)</label>
                                    <select id="sleep-hours" name="sleep-hours">
                                        <option value="0">0</option>
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                        <option value="6">6</option>
                                        <option value="7">7</option>
                                        <option value="8">8</option>
                                        <option value="9">9</option>
                                        <option value="10+">10+</option>
                                    </select>
                                    <select id="sleep-minutes" name="sleep-minutes">
                                        <option value="0">:00</option>
                                        <option value="15">:15</option>
                                        <option value="30">:30</option>
                                        <option value="45">:45</option>
                                    </select>
                                </div>
                                <div class="field-row">
                                    <label for="sleep-quality">Sleep (quality)</label>
                                    <select id="sleep-quality" name="sleep-quality">
                                        <option value="poor">Poor</option>
                                        <option value="fair">Fair</option>
                                        <option value="good">Good</option>
                                    </select>
                                </div>
                                <div class="field-row">
                                    <label for="stress">Stress</label>
                                    <select id="stress" name="stress">
                                        <option value="none">None</option>
                                        <option value="mild">Mild</option>
                                        <option value="moderate">Moderate</option>
                                        <option value="severe">Severe</option>
                                    </select>
                                </div>
                                <div class="field-row">
                                    <label for="illness">Illness</label>
                                    <input type="checkbox" id="illness" name="illness">
                                </div>
                                <div class="field-row">
                                    <label for="menstruation">Menstruation</label>
                                    <input type="checkbox" id="menstruation" name="menstruation">
                                </div>
                                <div class="field-row">
                                    <label for="routine-disruption">Routine Disruption</label>
                                    <input type="checkbox" id="routine-disruption" name="routine-disruption">
                                </div>
                                <div class="field-row">
                                    <label for="exercise">Exercise</label>
                                    <select id="exercise" name="exercise">
                                        <option value="none">None</option>
                                        <option value="light">Light</option>
                                        <option value="moderate">Moderate</option>
                                        <option value="intense">Intense</option>
                                    </select>
                                </div>
                            </div>
                    </details>
                    <details>
                        <summary>Diet</summary>
                            <div class="details-content">
                                <div class="field-row">
                                    <label for="gluten">Gluten</label>
                                    <input type="checkbox" id="gluten" name="gluten">
                                </div>
                                <div class="field-row">
                                    <label for="soy">Soy</label>
                                    <input type="checkbox" id="soy" name="soy">
                                </div>
                                <div class="field-row">
                                    <label for="dairy">Dairy</label>
                                    <input type="checkbox" id="dairy" name="dairy">
                                </div>
                                <div class="field-row">
                                    <label for="nightshades">Nightshades</label>
                                    <input type="checkbox" id="nightshades" name="nightshades">
                                </div>
                                <div class="field-row">
                                    <label for="grains">Grains</label>
                                    <input type="checkbox" id="grains" name="grains">
                                </div>
                                <div class="field-row">
                                    <label for="nuts-seeds">Nuts/seeds</label>
                                    <input type="checkbox" id="nuts-seeds" name="nuts-seeds">
                                </div>
                                <div class="field-row">
                                    <label for="alcohol">Alcohol</label>
                                    <input type="checkbox" id="alcohol" name="alcohol">
                                </div>
                                <div class="field-row">
                                    <label for="caffeine">Caffeine</label>
                                    <input type="checkbox" id="caffeine" name="caffeine">
                                </div>
                                <div class="field-row">
                                    <label for="sugar">Added sugar</label>
                                    <input type="checkbox" id="sugar" name="sugar">
                                </div>
                                <div class="field-row">
                                    <label for="unknown-exposure">Possible unkwown exposure</label>
                                    <input type="checkbox" id="unknown-exposure" name="unknown-exposure">
                                </div>
                            </div>
                    </details>
                    <details>
                        <summary>Medications/supplements</summary>
                            <div class="details-content">
                                <div class="field-row">
                                    <label for="levothyroxine">Levothyroxine</label>
                                    <select id="levothyroxine" name="levothyroxine">
                                        <option value="on-time">Taken on time</option>
                                        <option value="late">Taken late</option>
                                        <option value="missed">Missed</option>
                                    </select>
                                </div>
                                <div class="field-row">
                                    <label for="desiccated-thyroid-hormone">Desiccated thyroid hormone</label>
                                    <select id="desiccated-thyroid-hormone" name="desiccated-thyroid-hormone">
                                        <option value="on-time">Taken on time</option>
                                        <option value="late">Taken late</option>
                                        <option value="missed">Missed</option>
                                    </select>
                                </div>
                                <div class="field-row">
                                    <label for="liothyronine">Liothyronine (T3)</label>
                                    <select id="liothyronine" name="liothyronine">
                                        <option value="on-time">Taken on time</option>
                                        <option value="late">Taken late</option>
                                        <option value="missed">Missed</option>
                                    </select>
                                </div>
                                <div class="field-row">
                                    <label for="tymlos">Tymlos</label>
                                    <select id="tymlos" name="tymlos">
                                        <option value="on-time">Taken on time</option>
                                        <option value="late">Taken late</option>
                                        <option value="missed">Missed</option>
                                    </select>
                                </div>
                                <div class="field-row">
                                    <label for="glp1">GLP-1</label>
                                    <select id="glp1" name="glp1">
                                        <option value="on-time">Taken on time</option>
                                        <option value="late">Taken late</option>
                                        <option value="missed">Missed</option>
                                    </select>
                                </div>
                                <div class="field-row">
                                    <label for="selenium">Selenium</label>
                                    <input type="checkbox" id="selenium" name="selenium">
                                </div>
                                <div class="field-row">
                                    <label for="vit-d">Vitamin D</label>
                                    <input type="checkbox" id="vit-d" name="vit-d">
                                </div>
                                <div class="field-row">
                                    <label for="zinc">Zinc</label>
                                    <input type="checkbox" id="zinc" name="zinc">
                                </div>
                                <div class="field-row">
                                    <label for="magnesium">Magnesium</label>
                                    <input type="checkbox" id="magnesium" name="magnesium">
                                </div>
                                <div class="field-row">
                                    <label for="myo-inositol">Myo-inositol</label>
                                    <input type="checkbox" id="myo-inositol" name="myo-inositol">
                                </div>
                                <div class="field-row">
                                    <label for="iron">Iron</label>
                                    <input type="checkbox" id="iron" name="iron">
                                </div>
                                <div class="field-row">
                                    <label for="ashwagandha">Ashwagandha</label>
                                    <input type="checkbox" id="ashwagandha" name="ashwagandha">
                                </div>
                                <div class="field-row">
                                    <label for="omega-3">Omega-3 fatty acids</label>
                                    <input type="checkbox" id="omega-3" name="omega-3">
                                </div>
                                <div class="field-row">
                                    <label for="probiotics">Probiotics</label>
                                    <input type="checkbox" id="probiotics" name="probiotics">
                                </div>
                                <div class="field-row">
                                    <label for="ldn">Low dose naltrexone (LDN)</label>
                                    <input type="checkbox" id="ldn" name="ldn">
                                </div>
                            </div>
                    </details>
                    <button type="submit" class="btn">Submit</button>
                    <button type="button" class="btn" disabled>
                        Clear
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 1a5 5 0 00-5 5v3H5a2 2 0 00-2 2v10a2 2 0 002 2h14a2 2 0 002-2V11a2 2 0 00-2-2h-2V6a5 5 0 00-5-5zm3 8H9V6a3 3 0 016 0v3z"/>
                        </svg>
                    </button>
                </form>
            </main>
            <nav class="bottom-nav">
                <a href="home.html" class="nav-item">
                    <img src="home.svg" alt="Home icon">
                    <span>Home</span>
                </a>
                <a href="trends.html" class="nav-item">
                    <img src="trends.svg" alt="Trends icon">
                    <span>Trends</span>
                </a>
                <a href="history.html" class="nav-item">
                    <img src="history.svg" alt="History icon">
                    <span>History</span>
                </a>
                <a href="profile.html" class="nav-item">
                    <img src="profile.svg" alt="Profile icon">
                    <span>Profile</span>
                </a>
                <a href="help.html" class="nav-item">
                    <img src="help.svg" alt="Help icon">
                    <span>Help</span>
                </a>
            </nav>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hashi Tracker Prototype</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-background">
        <div class="page-content">
            <header>
                <h1>History</h1>
            </header>
            <main>
                <p>Take a peek at your logging history here:</p>
                <form class="history-form">
                    <div class="field-row">
                        <input type="radio" id="days-from-current-radio" name="history-type" value="days-from-current">
                        <label for="days-from-current-radio">Select days prior to current</label>
                    </div>
                    <select id="days-from-current-select" name="days-from-current">
                        <option value="7">7 days</option>
                        <option value="14">14 days</option>
                        <option value="30">30 days</option>
                        <option value="60">60 days</option>
                        <option value="90">90 days</option>
                    </select>

                    <p>OR</p>

                    <div class="field-row">
                        <input type="radio" id="specific-date-radio" name="history-type" value="specific-date">
                        <label for="specific-date-radio">Choose a specific date</label>
                    </div>
                    <input type="date" id="specific-date-input" name="specific-date">
                    <button class="btn">Show history</button>
                </form>
            </main>
            <nav class="bottom-nav">
                <a href="home.html" class="nav-item">
                    <img src="home.svg" alt="Home icon">
                    <span>Home</span>
                </a>
                <a href="trends.html" class="nav-item">
                    <img src="trends.svg" alt="Trends icon">
                    <span>Trends</span>
                </a>
                <a href="history.html" class="nav-item">
                    <img src="history.svg" alt="History icon">
                    <span>History</span>
                </a>
                <a href="profile.html" class="nav-item">
                    <img src="profile.svg" alt="Profile icon">
                    <span>Profile</span>
                </a>
                <a href="help.html" class="nav-item">
                    <img src="help.svg" alt="Help icon">
                    <span>Help</span>
                </a>
            </nav>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hashi Tracker Prototype</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-background">
        <div class="page-content">
            <header>
                <h1>Create your HashiTracker account</h1>
            </header>
            <main>
                <form>
                    <p class="form-intro">Ready to get started? Just fill out the form below and you're all set!</p>
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="e.g. Jane Smith">
                    <label for="password">Enter password</label>
                    <input type="password" id="password" name="password" placeholder="8-12 characters">
                    <label for="repeat-password">Re-enter password</label>
                    <input type="password" id="repeat-password" name="repeat-password" placeholder="Re-enter password">
                    <a href="home.html" class="btn btn-signup">Sign up</a>
                </form>
                <p>Already have an account? <a href="login.html">Log in here</a></p>
            </main>
        </div>
    </div>
</body>
</html>

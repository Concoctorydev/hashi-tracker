<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Hashi Tracker Prototype</title>
</head>
<body>
    <div class="page-background">
        <div class="page-content">
            <header>
                <h1>Create your HashiTracker account</h1>
            </header>
            <main>
                <form action="/signup" method="POST">
                    <p class="form-intro">Ready to get started? Just fill out the form below and you're all set!</p>
                    
                    {% if error %}
                    <p class="form-error">{{error}}</p>
                    {% endif %}
                    
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="e.g. yourname@email.com" required>
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="e.g. Jane Smith" pattern="[\w\-]+" title="Letters, numbers, hyphens, and underscores only." required>
                    <label for="password">Enter password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="8-14 characters, needs 1 letter & 1 number" minlength="8" maxlength="14" required>
                        <button type="button" class="toggle-password" data-target="password" aria-label="Show password">
                            <img src="{{ url_for('static', filename='eye.svg') }}" alt="Show password">
                        </button>
                    </div>

                    <label for="repeat-password">Re-enter password</label>
                    <div class="password-wrapper">
                        <input type="password" id="repeat-password" name="repeat-password" placeholder="Re-enter password" minlength="8" maxlength="14" required>
                        <button type="button" class="toggle-password" data-target="repeat-password" aria-label="Show password">
                            <img src="{{ url_for('static', filename='eye.svg') }}" alt="Show password">
                        </button>
                    </div>
                    <button type="submit" class="btn btn-signup">Sign up</button>
                </form>
                <p>Already have an account? <a href="{{ url_for('login') }}">Log in here</a></p>
            </main>
        </div>
    </div>
    <script>
        document.querySelectorAll('.toggle-password').forEach(button => {
            const img = button.querySelector('img');
            button.addEventListener('click', () => {
                const targetId = button.getAttribute('data-target');
                const input = document.getElementById(targetId);
                if (input.type === 'password') {
                    input.type = 'text';
                    img.src = "{{ url_for('static', filename='eye-off.svg') }}";
                    img.alt = 'Hide password';
                    button.setAttribute('aria-label', 'Hide password');
                } else {
                    input.type = 'password';
                    img.src = "{{ url_for('static', filename='eye.svg') }}";
                    img.alt = 'Show password';
                    button.setAttribute('aria-label', 'Show password');
                }
            });
        });
    </script>
</body>
</html>

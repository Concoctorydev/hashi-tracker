<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Hashi Tracker Prototype</title>
</head>
<body>
    <div class="page-background">
        <div class="page-content">
            <header>
                <h1>Create your HashiTracker account</h1>
            </header>
            <main>
                <form action="/signup" method="POST">
                    <p class="form-intro">Ready to get started? Just fill out the form below and you're all set!</p>
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="e.g. yourname@email.com" required>
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="e.g. Jane Smith" required>
                    <label for="password">Enter password</label>
                    <input type="password" id="password" name="password" placeholder="8-12 characters, 1 uppercase letter and 1 number" required>
                    <label for="repeat-password">Re-enter password</label>
                    <input type="password" id="repeat-password" name="repeat-password" placeholder="Re-enter password" required>
                    <button type="submit" class="btn btn-signup">Sign up</button>
                </form>
                <p>Already have an account? <a href="login.html">Log in here</a></p>
            </main>
        </div>
    </div>
</body>
</html>

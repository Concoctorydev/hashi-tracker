<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Hashi Tracker Prototype</title>
</head>
<body>
    <div class="page-background">
        <div class="page-content">
            <header>
                <h1>History</h1>
            </header>
            <main>
                <p>Take a peek at your logging history here:</p>
                <form class="history-form">
                    <div class="field-row">
                        <input type="radio" id="days-from-current-radio" name="history-type" value="days-from-current">
                        <label for="days-from-current-radio">Select lookback period</label>
                    </div>
                    <select id="days-from-current-select" name="days-from-current">
                        <option value="7">7 days</option>
                        <option value="14">14 days</option>
                        <option value="30">30 days</option>
                        <option value="60">60 days</option>
                        <option value="90">90 days</option>
                    </select>

                    <div class="or-divider">
                        <span>OR</span>
                    </div>

                    <div class="field-row">
                        <input type="radio" id="calendar-pick-radio" name="history-type" value="calendar-pick">
                        <label for="calendar-pick-radio">Pick date(s) on calendar</label>
                    </div>
                    <div id="calendar-picker-placeholder" class="calendar-picker-placeholder">
                        <!-- calendar-based single/range picker goes here later -->
                    </div>

                    <button class="btn">Show history</button>
                </form>
            </main>
            <nav class="bottom-nav">
                <a href="{{ url_for('home') }}" class="nav-item">
                    <img src="{{ url_for('static', filename='home.svg') }}" alt="Home icon">
                    <span>Home</span>
                </a>
                <a href="{{ url_for('trends') }}" class="nav-item">
                    <img src="{{ url_for('static', filename='trends.svg') }}" alt="Trends icon">
                    <span>Trends</span>
                </a>
                <a href="{{ url_for('history') }}" class="nav-item">
                    <img src="{{ url_for('static', filename='history.svg') }}" alt="History icon">
                    <span>History</span>
                </a>
                <a href="{{ url_for('profile') }}" class="nav-item">
                    <img src="{{ url_for('static', filename='profile.svg') }}" alt="Profile icon">
                    <span>Profile</span>
                </a>
                <a href="{{ url_for('help') }}" class="nav-item">
                    <img src="{{ url_for('static', filename='help.svg') }}" alt="Help icon">
                    <span>Help</span>
                </a>
            </nav>
        </div>
    </div>
</body>
</html>
